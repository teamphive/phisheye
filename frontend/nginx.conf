# NPM already sets X-Forwarded-Proto to the browser's scheme (https).
# $scheme here is always http, this container never terminates TLS, so
# pass the header through instead of overwriting it. Falls back to
# $scheme for direct requests, e.g. local testing.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # docker dns, keeps a recreated backend/keycloak container reachable.
    # A plain proxy_pass would keep nginx's first-seen ip.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;
    set $keycloak http://keycloak:8080;

    # the API answers under the same origin, so the browser needs no CORS
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 30m;
    }

    # Keycloak serves under /auth itself (KC_HTTP_RELATIVE_PATH), forwarded
    # unchanged, no rewrite needed. Only the frontend needs to be public.
    location /auth/ {
        proxy_pass $keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # large headers (cookies, SAML/OIDC params), nginx' defaults cause 502s
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
