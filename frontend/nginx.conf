server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # docker dns, so a recreated backend/keycloak container is found again.
    # With a plain proxy_pass nginx keeps the ip it saw at startup.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;
    set $keycloak http://keycloak:8080;

    # the API answers under the same origin, so the browser needs no CORS
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
    }

    # the admin console, blocked from the internet. Reach it locally on the
    # server through the Keycloak container's own port (127.0.0.1:8080),
    # e.g. via an SSH tunnel. Longer prefix, so nginx prefers this over
    # /auth/ below regardless of the order the locations appear in.
    location /auth/admin/ {
        deny all;
    }

    # Keycloak itself serves under /auth (KC_HTTP_RELATIVE_PATH), so this
    # forwards the request unchanged, no rewrite needed. That way only the
    # frontend needs to be public, Keycloak stays off the internet directly.
    location /auth/ {
        proxy_pass $keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keycloak's login page sends large headers (cookies, SAML/OIDC
        # params), nginx' small defaults cause 502s
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
