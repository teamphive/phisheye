<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg-inset" style="background-color:#f5f7fa;border:1px solid #dde3ec;border-radius:8px;margin:20px 0 8px 0;">
  <tr>
    <td style="padding:14px 16px;font-family:'Instrument Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;">
      <div class="text-muted" style="color:#5c687f;font-size:11px;letter-spacing:0.4px;text-transform:uppercase;">Betreff</div>
      <div class="text-main" style="color:#0f1724;font-weight:600;margin-bottom:10px;">{{ analysis.subject or "(ohne Betreff)" }}</div>
      <div class="text-muted" style="color:#5c687f;font-size:11px;letter-spacing:0.4px;text-transform:uppercase;">Absender</div>
      <div class="text-main" style="color:#0f1724;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;">{{ analysis.sender }}</div>
    </td>
  </tr>
</table>
