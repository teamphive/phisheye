# git-cliff config, used by .github/workflows/release.yml
# https://git-cliff.org/docs/configuration
#
# Preview the next release locally (needs uv, see setup.md):
#   uvx git-cliff@2.14.2 --unreleased --bump

[changelog]
header = """
# Changelog

All notable changes to phisheye. Generated by [git-cliff](https://git-cliff.org) from the conventional commits on main.\n
"""
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version }}](<REPO>/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version }}](<REPO>/tree/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## Unreleased
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}**BREAKING** {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/teamphive/phisheye" },
]

[git]
conventional_commits = true
# drops "Merge pull request ...", "db schema" and similar
filter_unconventional = true
commit_preprocessors = [
    # link the PR number that GitHub appends to squash merges
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](<REPO>/pull/${1}))" },
]
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^wip", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^ref", group = "Refactoring" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^(ci|build)", group = "CI/CD" },
    { message = "^revert", group = "Reverts" },
    { message = ".*", group = "Other" },
]
# versions are plain semver without a "v" prefix: 0.1.2, not v0.1.2
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order_commits = true
sort_commits = "oldest"

[bump]
initial_tag = "0.1.0"
# stay on 0.x until the team decides on 1.0: feat bumps the minor version,
# fix and everything else the patch version, a breaking change the minor one
features_always_bump_minor = true
breaking_always_bump_major = false
