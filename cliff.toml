# git-cliff config, used by .github/workflows/release.yml
# https://git-cliff.org/docs/configuration
# Layout after dj95/zjstatus: emoji sections, scope in italics, a note from
# the annotated tag above the sections.
#
# Preview the next release locally (brew install git-cliff):
#   git cliff --unreleased --bump

[changelog]
header = """
# Changelog\n
All notable changes to phisheye. Generated by [git-cliff](https://git-cliff.org) from the conventional commits on main.\n
"""
# The tag message goes on top when it says more than the version, e.g.
# git tag -a 0.2.0 -m "⚠️ Needs KEYCLOAK_PUBLIC_URL in .env"
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version }}](<REPO>/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version }}](<REPO>/tree/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% if message and message | trim != version %}
{{ message | trim }}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/teamphive/phisheye" },
]

[git]
conventional_commits = true
# drops "Merge pull request ...", "db schema" and similar
filter_unconventional = true
commit_preprocessors = [
    # link the PR number that GitHub appends to squash merges
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](<REPO>/pull/${1}))" },
]
# The first match wins. The number in the comment orders the sections,
# striptags removes it from the heading.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^wip", skip = true },
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^ref", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^(chore|ci|build)", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { message = "^revert", group = "<!-- 8 -->◀️ Revert" },
    { message = ".*", group = "<!-- 9 -->💼 Other" },
]
# versions are plain semver without a "v" prefix: 0.1.2, not v0.1.2
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order_commits = true
sort_commits = "oldest"

[bump]
initial_tag = "0.1.0"
# stay on 0.x until the team decides on 1.0: feat bumps the minor version,
# fix and everything else the patch version, a breaking change the minor one
features_always_bump_minor = true
breaking_always_bump_major = false
