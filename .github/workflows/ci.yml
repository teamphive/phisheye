name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typen prüfen
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Abhängigkeiten installieren
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatierung prüfen
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  image:
    name: Docker-Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend-Image bauen
        run: docker build -t phisheye-backend:ci backend

  infra:
    name: Infrastruktur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: Formatierung prüfen
        run: tofu fmt -check -recursive infra

      - name: Konfiguration prüfen
        run: |
          for dir in infra/bootstrap infra/main; do
            echo "== $dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
          done
