name: Release

# Runs on a pushed version tag like 0.1.2, e.g. from `just bump-version push`
# on main, see docs/release.md.
# 1. prepare: check the tag and show the release notes
# 2. images: backend, frontend and keycloak image to ghcr.io
# 3. release: GitHub release, then the CHANGELOG.md commit on main. The tag
#    exists already, so the changelog commit lands after it.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_CLIFF_VERSION: v2.14.2

jobs:
  prepare:
    name: Check tag and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      # the tagged commit with the whole history, all tags and origin/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag
        id: check
        run: |
          VERSION="$GITHUB_REF_NAME"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like 0.1.2, without v"
            exit 1
          fi
          # the changelog commit goes to main, so the tag has to be on main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $VERSION is not on main. Delete it with 'git push --delete origin $VERSION' and tag a commit on main"
            exit 1
          fi
          highest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$highest" != "$VERSION" ]; then
            echo "::error::$VERSION is not the newest version, $highest exists already"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: ${{ env.GIT_CLIFF_VERSION }}
          args: --current --strip header
        env:
          OUTPUT: ${{ runner.temp }}/RELEASE_NOTES.md

      - name: Show release notes
        run: |
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"
          if ! grep -q '^- ' "$notes"; then
            echo "::warning::No conventional commits since the last release, the changelog entry stays empty"
          fi
          {
            echo "# Release $GITHUB_REF_NAME"
            echo
            cat "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Image ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
            # Vite bakes these into the bundle, so they are the addresses the
            # browser uses on the server. KEYCLOAK_PUBLIC_URL is a repository
            # variable (Settings -> Secrets and variables -> Actions -> Variables),
            # without /auth like in .env, Keycloak itself answers under /auth.
            # LOGS_URL is optional, without it "Logs öffnen" stays hidden.
            build-args: |
              VITE_API_URL=/api
              VITE_KEYCLOAK_URL=${{ vars.KEYCLOAK_PUBLIC_URL || 'https://phisheye.neumann-it.org' }}/auth
              VITE_KEYCLOAK_REALM=phisheye
              VITE_KEYCLOAK_CLIENT_ID=phisheye-frontend
              VITE_LOGS_URL=${{ vars.LOGS_URL }}
          # stock Keycloak plus the login theme, see the keycloak stage in frontend/Dockerfile
          - image: keycloak
            context: frontend
            target: keycloak
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.2.0, 0.2, latest and sha-<commit>. The fixed version tags are what a
      # rollback on the server points to.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          # the homelab VM is x86
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub release and changelog
    needs: [prepare, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # generated from the tag, not from main: commits merged after the tag
      # belong to the next release
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          version: ${{ env.GIT_CLIFF_VERSION }}
        env:
          OUTPUT: ${{ runner.temp }}/CHANGELOG.md

      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: ${{ env.GIT_CLIFF_VERSION }}
          args: --current --strip header
        env:
          OUTPUT: ${{ runner.temp }}/RELEASE_NOTES.md

      # edit instead of create on a re-run or when the release was made in the GitHub UI
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"
          {
            echo
            echo "### Docker images"
            echo
            echo '```'
            for image in backend frontend keycloak; do
              echo "ghcr.io/$GITHUB_REPOSITORY-$image:$VERSION"
            done
            echo '```'
          } >> "$notes"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file "$notes"
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file "$notes" --verify-tag
          fi
          echo "Released [$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION)" >> "$GITHUB_STEP_SUMMARY"

      # Only main moves, the tag stays where it is. If main moved on during the
      # run, the push is rejected: re-run this job.
      - name: Commit CHANGELOG.md to main
        run: |
          git switch main
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is up to date already"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git push origin HEAD:main
