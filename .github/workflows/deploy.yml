name: Deploy

# Builds on the VM for now, later it pulls the images of the release pipeline
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
      - "design-system/**"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push waits instead of breaking a running one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # secrets live in the environment, only main may use it
    environment:
      name: production
      url: https://phisheye.neumann-it.org
    timeout-minutes: 30
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT }}
          USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # pinned host key, a changed key fails the deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the later steps only say "ssh vm"
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $HOST
            Port $PORT
            User $USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF

      - name: Deploy on the VM
        env:
          SHA: ${{ github.sha }}
        run: |
          ssh vm "bash -s -- $SHA" <<'EOF'
          set -euo pipefail
          cd /opt/phisheye

          # exactly the commit that triggered the run, never a merge on the VM
          git fetch origin main
          git merge --ff-only "$1"
          echo "Deploying $(git log -1 --format='%h %s')"

          docker compose --profile app up -d --build --force-recreate
          EOF

      # through the public domain, so DNS, proxy and TLS are checked as well
      - name: Wait until the app answers
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 https://phisheye.neumann-it.org/api/health; then
              echo
              echo "Healthy after $attempt attempts"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Show the state on the VM
        if: failure()
        run: |
          ssh vm "cd /opt/phisheye && docker compose --profile app ps && docker compose --profile app logs --tail 50 backend"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
