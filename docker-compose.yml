---

# app services only start with `--profile app`, plain `up` stays infra only
services:
  db:
    image: postgres:18.6
    container_name: postges
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db_local-data:/var/lib/postgresql

  keycloak:
    # stock Keycloak plus the phisheye login theme, see the keycloak stage in
    # frontend/Dockerfile. After changes to the theme: up -d --build keycloak
    build:
      context: ./frontend
      target: keycloak
    container_name: keycloak
    restart: always
    entrypoint: ["/bin/bash", "/opt/keycloak/entrypoint.sh"]
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USER}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      # Keycloak writes this address into every token as issuer, the backend
      # checks it. Fixed instead of taken from each request, so it stays the
      # same whether the browser or the backend asks.
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}"
      # so the frontend can expose Keycloak under its own domain at /auth,
      # see the /auth location in frontend/nginx.conf
      KC_HTTP_RELATIVE_PATH: /auth
      # On the server a proxy ends TLS, its X-Forwarded headers tell Keycloak
      # the original https request and client IP. Safe while the port is only
      # bound to 127.0.0.1.
      KC_PROXY_HEADERS: xforwarded
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      SMTP_HOST: "${SMTP_HOST:-smtp.strato.de}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USERNAME: "${SMTP_USERNAME:-noreply@example.com}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    # the rendered realm goes here, an older volume has this folder owned by root
    tmpfs:
      - /opt/keycloak/data/import:mode=1777
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/realm-export.json:/opt/keycloak/template/realm-export.json:ro
      - ./docker/keycloak/entrypoint.sh:/opt/keycloak/entrypoint.sh:ro

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "db:5432:*:$$POSTGRES_USER:$$POSTGRES_PASSWORD" > /tmp/pgpass
        chmod 600 /tmp/pgpass
        exec /entrypoint.sh
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio-data:/data

  migrate:
    build: ./backend
    image: phisheye-backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      KEYCLOAK_URL: "http://keycloak:8080/auth"
      KEYCLOAK_PUBLIC_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/auth"
    command: alembic upgrade head
    restart: "no"
    profiles: [app]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    image: phisheye-backend
    container_name: backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      KEYCLOAK_URL: "http://keycloak:8080/auth"
      KEYCLOAK_PUBLIC_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/auth"
    restart: unless-stopped
    profiles: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build: ./backend
    image: phisheye-backend
    container_name: worker
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      KEYCLOAK_URL: "http://keycloak:8080/auth"
      KEYCLOAK_PUBLIC_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/auth"
    command: arq app.worker.settings.WorkerSettings
    restart: unless-stopped
    profiles: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-/api}"
        VITE_KEYCLOAK_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/auth"
        VITE_KEYCLOAK_REALM: "${VITE_KEYCLOAK_REALM:-phisheye}"
        VITE_KEYCLOAK_CLIENT_ID: "${VITE_KEYCLOAK_CLIENT_ID:-phisheye-frontend}"
    container_name: frontend
    restart: unless-stopped
    profiles: [app]
    depends_on:
      - backend
      - keycloak
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  db_local-data:
  keycloak-data:
  pgadmin-data:
  redis-data:
  minio-data:
