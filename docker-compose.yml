---

# The VM's search domain neumann-it.org has a wildcard record. While a service
# is missing (a restart), `redis` would turn into `redis.neumann-it.org` and
# lead to another host. Without search domain a missing name stays missing.
x-no-search-domain: &no-search-domain
  dns_search: ["."]

# app services only start with `--profile app`, plain `up` stays infra only
services:
  db:
    <<: *no-search-domain
    image: postgres:18.6
    container_name: postges
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db_local-data:/var/lib/postgresql

  keycloak:
    <<: *no-search-domain
    # stock Keycloak plus the phisheye login theme, see the keycloak stage in
    # frontend/Dockerfile. After changes to the theme: up -d --build keycloak
    build:
      context: ./frontend
      target: keycloak
    container_name: keycloak
    restart: always
    entrypoint: ["/bin/bash", "/opt/keycloak/entrypoint.sh"]
    # production mode with the options the image was built with
    command: ["start", "--optimized", "--import-realm"]
    ports:
      # only for a local SSH tunnel if the public admin console is ever
      # unreachable, not the regular way in
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USER}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/auth"
      # TLS ends at the Nginx Proxy Manager, Keycloak itself speaks plain HTTP.
      # The /auth path is baked into the image (frontend/Dockerfile), a value
      # here would be ignored by --optimized.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      SMTP_HOST: "${SMTP_HOST:-smtp.strato.de}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USERNAME: "${SMTP_USERNAME:-noreply@example.com}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      KEYCLOAK_SERVICE_CLIENT_SECRET: "${KEYCLOAK_SERVICE_CLIENT_SECRET}"
    # the rendered realm goes here, an older volume has this folder owned by root
    tmpfs:
      - /opt/keycloak/data/import:mode=1777
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/realm-export.json:/opt/keycloak/template/realm-export.json:ro
      - ./docker/keycloak/entrypoint.sh:/opt/keycloak/entrypoint.sh:ro

  pgadmin:
    <<: *no-search-domain
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "db:5432:*:$$POSTGRES_USER:$$POSTGRES_PASSWORD" > /tmp/pgpass
        chmod 600 /tmp/pgpass
        exec /entrypoint.sh
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

  redis:
    <<: *no-search-domain
    image: redis:7-alpine
    platform: linux/amd64
    container_name: redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  minio:
    <<: *no-search-domain
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio-data:/data

  migrate:
    <<: *no-search-domain
    build: ./backend
    image: phisheye-backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_PUBLIC_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}"
    command: alembic upgrade head
    restart: "no"
    profiles: [app]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *no-search-domain
    build: ./backend
    image: phisheye-backend
    container_name: backend
    env_file: .env
    ports:
      # metrics for Prometheus, on the server METRICS_BIND is the LAN address
      - "${METRICS_BIND:-127.0.0.1}:9101:9101"
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_PUBLIC_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}"
      # nginx serves the API under /api, so Swagger finds /api/openapi.json
      ROOT_PATH: /api
      DOCS_ENABLED: "${DOCS_ENABLED:-true}"
    restart: unless-stopped
    profiles: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    <<: *no-search-domain
    build: ./backend
    image: phisheye-backend
    container_name: worker
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_PUBLIC_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}"
    command: arq app.worker.settings.WorkerSettings
    restart: unless-stopped
    profiles: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    <<: *no-search-domain
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-/api}"
        VITE_KEYCLOAK_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/auth"
        VITE_KEYCLOAK_REALM: "${VITE_KEYCLOAK_REALM:-phisheye}"
        VITE_KEYCLOAK_CLIENT_ID: "${VITE_KEYCLOAK_CLIENT_ID:-phisheye-frontend}"
    container_name: frontend
    restart: unless-stopped
    profiles: [app]
    depends_on:
      - backend
      - keycloak
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  db_local-data:
  keycloak-data:
  pgadmin-data:
  redis-data:
  minio-data:
