<!doctype html><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"><style>html,body{margin:0;background:var(--background)}svg{display:block;width:960px;height:300px}
.navy{fill:var(--brand-navy);rx:var(--radius-lg)}.sky{fill:var(--brand-sky)}.skyb{fill:var(--brand-sky);rx:var(--radius-lg)}.wash{fill:var(--accent);rx:var(--radius-lg)}.ring{fill:var(--brand-sky)}.cut{fill:var(--brand-navy)}
.n{font:600 88px/1 Inter,system-ui,sans-serif;letter-spacing:-3px;fill:var(--foreground)}.tg{font:400 14px Inter,system-ui,sans-serif;fill:var(--muted-foreground)}</style>
<svg viewBox="0 0 960 300">
<!-- blocks: brand-navy slab 280x308, brand-sky 192x176 bleeding right, accent wash 192x108 -->
<!-- arrangement: tall slab left of two stacked satellites, bleeding off top and right -->
<!-- pattern: concentric ring and pupil cut into the slab, because the mark is a hook eyelet that reads as an eye -->
<!-- scales: gaps 16px (space-4), radius-lg 8px -->
<rect class="navy" x="480" y="-8" width="280" height="308"/>
<rect class="skyb" x="776" y="-8" width="200" height="184"/>
<rect class="wash" x="776" y="192" width="200" height="116"/>
<circle class="ring" cx="620" cy="140" r="84"/><circle class="cut" cx="620" cy="140" r="52"/><circle class="ring" cx="620" cy="140" r="22"/>
<text class="n" x="36" y="216">phisheye</text>
<text class="tg" x="40" y="246">Phishing-Mails prüfen, bevor sie Schaden anrichten.</text>
</svg>
