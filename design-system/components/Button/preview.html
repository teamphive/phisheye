<!-- @dsCard group="Aktionen" height=150 subtitle="Hauptbutton blau, sonst neutral" -->
<!doctype html><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap"><style>body{margin:0;padding:20px;background:var(--background);color:var(--foreground);font:400 14px/20px Inter,system-ui,sans-serif}.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.b{font:500 14px/20px Inter,sans-serif;border-radius:var(--radius-md);padding:8px 14px;border:1px solid transparent;cursor:pointer}
.p{background:var(--primary);color:var(--primary-foreground)}
.o{background:var(--card);color:var(--foreground);border-color:var(--input)}
.s{background:var(--muted);color:var(--foreground)}
.g{background:transparent;color:var(--foreground)}
.d{background:transparent;color:var(--destructive);border-color:var(--input)}
.f{outline:2px solid var(--ring);outline-offset:2px}</style>
<div class="row"><button class="b p">Neue Analyse</button><button class="b o">Exportieren</button><button class="b s">Abbrechen</button><button class="b g">Mehr</button><button class="b d">Entfernen</button></div>
<div class="row" style="margin-top:16px"><button class="b p f">Fokus</button><button class="b p" style="opacity:.5">Deaktiviert</button></div>
